# Local single-host deployment. For a multi-machine fleet, run Redis on one host and
# start additional `worker` containers on other hosts with CC_REDIS_URL pointing at it.
name: cryptocensus

services:
  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # Bound to loopback: the queue is reachable only from this host, never the LAN.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  worker:
    build: .
    command: ["work"]
    # Stateless and non-root: pulls images with crane (daemonless) and pushes results to Redis.
    user: "${CC_UID:-1000}:${CC_GID:-1000}"
    environment:
      CC_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 2

  # One-shot host roles are run on demand, e.g.:
  #   docker compose run --rm tools seed    --file /frame/sample-images.txt
  #   docker compose run --rm tools collect --out /data
  #   docker compose run --rm tools analyze --dataset /data
  tools:
    build: .
    profiles: ["tools"]
    environment:
      CC_REDIS_URL: redis://redis:6379/0
      CC_OUTPUT_DIR: /data
    volumes:
      - ./config:/frame:ro
      - ./dataset:/data
    depends_on:
      redis:
        condition: service_healthy
