[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptocensus"
version = "0.1.0"
description = "A reproducible, distributed census of the cryptographic posture and post-quantum readiness of public container images."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["cryptography", "containers", "post-quantum", "measurement", "sbom", "cbom"]
dependencies = [
    "cryptography>=41,<46",
    "redis>=5,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
cryptocensus = "cryptocensus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
